name: digitalfix-report
services:
  report:
    build: .
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES:-rabbitmq1:5672,rabbitmq2:5672}
      RABBITMQ_VHOST: digitalfix
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Configura usuario propio de Report}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Configura contraseña de Report}
    volumes:
      - report-data:/data
    networks:
      - messaging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  report-data:
networks:
  messaging:
    external: true
    name: digitalfix-messaging
